# 통합 테스트 프로필.
# - MySQL 은 Testcontainers @ServiceConnection 이 주입한다.
# - Redis 는 RedisConfig 가 @Value 로 직접 팩토리를 만들어 @ServiceConnection 을 우회하므로
#   여기서 값을 채워 컨텍스트만 로드시킨다. (테스트가 Redis 를 실제로 호출하지는 않음)
#   RedisConfig 를 오토컨피그 기반으로 바꾸는 건 이후 스테이지에서.
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/newspin
    username: test
    password: test
  mail:
    host: localhost
    port: 3025
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: true
  cache:
    type: simple   # 테스트는 Redis 컨테이너 없이 인메모리 캐시로 캐싱 동작만 검증
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1uZXdzcGluLWJhY2tlbmQtaW50ZWdyYXRpb24=
    access-token:
      expire-time: 86400000
    refresh-token:
      expire-time: 259200000

# 외부 연동은 테스트에서 호출하지 않는다 (값만 채워 컨텍스트 로드용).
gemini:
  api-key: test
  model: gemini-3.5-flash
ai-service:
  url: http://localhost:1
server:
  url: http://localhost:8080

spring.mail:
  username: test
  password: test

newspin:
  seed:
    enabled: true
    dir: tools/seed/data

logging:
  level:
    org.hibernate.SQL: warn
