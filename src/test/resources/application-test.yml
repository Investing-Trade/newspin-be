# 통합 테스트 프로필. DataSource/Redis 는 Testcontainers @ServiceConnection 이 주입한다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/newspin
    username: test
    password: test
  mail:
    host: localhost
    port: 3025
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      password:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1uZXdzcGluLWJhY2tlbmQtaW50ZWdyYXRpb24=
    access-token:
      expire-time: 86400000
    refresh-token:
      expire-time: 259200000

# 외부 연동은 테스트에서 호출하지 않는다 (값만 채워 컨텍스트 로드용).
gemini:
  api-key: test
  model: gemini-2.5-flash
ai-service:
  url: http://localhost:1
server:
  url: http://localhost:8080

spring.mail:
  username: test
  password: test

newspin:
  seed:
    enabled: true
    dir: tools/seed/data

logging:
  level:
    org.hibernate.SQL: warn
