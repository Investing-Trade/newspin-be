spring:
  profiles:
    active: local
  datasource:
    url: ${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: 6379

  jwt:
    secret: ${JWT_SECRET_KEY}
    access-token:
      expire-time: 86400000
    refresh-token:
      expire-time: 259200000

  mail:
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


logging:
  level:
    org.hibernate.sql: debug

server:
  url: ${SERVER_URL}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash # 2.0 flash ~> 2.5-flash로 수정

ai-service:
  url: ${AI_SERVICE_URL}

---
spring:
  config:
    activate:
      on-profile: local
    import: optional:application-local.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import: application-prod.yml