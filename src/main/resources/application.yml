spring:
  profiles:
    active: local
  datasource:
    url: ${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT:6379}

  jwt:
    secret: ${JWT_SECRET_KEY}
    access-token:
      expire-time: 86400000
    refresh-token:
      expire-time: 259200000

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  url: ${SERVER_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: newspin-be

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.5-flash

ai-service:
  url: ${AI_SERVICE_URL}

newspin:
  seed:
    enabled: false
    dir: tools/seed/data
  cors:
    allowed-origins: ${NEWSPIN_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

---
spring:
  config:
    activate:
      on-profile: local
    import: optional:application-local.yml
logging:
  level:
    org.hibernate.SQL: debug

---
# docker-compose (docker-compose.yml) 기준 개발 프로필. bootRun/CI 공용.
#   docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=dev'
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3307/newspin?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: newspin
    password: newspin
  data:
    redis:
      host: localhost
      port: 6380
      password:
  jwt:
    secret: ${JWT_SECRET_KEY:ZGV2LW9ubHktc2VjcmV0LWtleS1uZXdzcGluLWJhY2tlbmQtMzJieXRlcys=}
  # docker-compose 의 Mailpit(가짜 SMTP, 인증/TLS 불필요) 로 보낸다 — 실제 발송 없이
  # http://localhost:8025 에서 발송된 메일을 그대로 확인할 수 있다.
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:dev@example.com}
    password: ${SPRING_MAIL_PASSWORD:dev}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  url: ${SERVER_URL:http://localhost:8080}

management:
  endpoint:
    health:
      show-details: always

gemini:
  api-key: ${GEMINI_API_KEY:dummy}
  model: gemini-3.5-flash

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

newspin:
  seed:
    enabled: true

logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: prod
    import: application-prod.yml
