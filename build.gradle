plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.gp'
version = '0.0.1-SNAPSHOT'
description = 'newspin-be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:1.21.3"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    // I-17: 0.11.5 의 deprecated API(parserBuilder, setSigningKey 등) 제거를 위해 0.12.x 로 갱신
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 관측성 (S0, I-12)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // 스키마 마이그레이션 (S0, I-15)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // 회복탄력성 — 외부 AI 연동 (S2, R-2). core 만 사용해 프로그래밍 방식으로 데코레이트
    // (SB4 에 대한 resilience4j-spring-boot 스타터 호환 리스크 회피)
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.3.0'
    implementation 'io.github.resilience4j:resilience4j-micrometer:2.3.0'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 통합 테스트 (S0, I-13)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'

    // 이메일 발송 테스트 (SMTP 설정 수정) — application-test.yml 의 mail.port=3025 가
    // GreenMail 기본 SMTP 포트(ServerSetupTest.SMTP)와 이미 일치해 별도 설정 불필요.
    testImplementation 'com.icegreen:greenmail-junit5:2.1.3'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
    // Testcontainers 통합 테스트는 Docker 를 요구한다.
    // Windows + Docker Desktop(named pipe)에서 docker-java 가 400 을 받는 알려진 문제가 있으면
    // DOCKER_HOST=tcp://localhost:2375 (Docker Desktop: Expose daemon on tcp) 로 우회한다.
    // CI(ubuntu)는 unix 소켓이라 문제 없음.  자세한 내용: docs/00-baseline/local-dev.md
}
